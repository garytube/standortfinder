<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>DIE DRAUSSENWERBER – Standorte finden</title>

<!-- Prototyp: von Suchmaschinen und KI-Crawlern ausschließen.
     Die Angaben gelten für alle gängigen Bots; googlebot und bingbot
     stehen zusätzlich einzeln, weil manche Crawler nur ihren eigenen
     Namen auswerten. Vor dem Livegang ersatzlos entfernen. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, nocache, max-snippet:-1, max-image-preview:none">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="slurp" content="noindex, nofollow">
<meta name="duckduckbot" content="noindex, nofollow">
<meta name="baiduspider" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<meta name="GPTBot" content="noindex, nofollow">
<meta name="ChatGPT-User" content="noindex, nofollow">
<meta name="Google-Extended" content="noindex, nofollow">
<meta name="CCBot" content="noindex, nofollow">
<meta name="PerplexityBot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<!-- Schrift: Typekit-Kit von DIE DRAUSSENWERBER -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/swi3ovf.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   1. DESIGN-TOKENS — alles zentral hier
   ══════════════════════════════════════════════════════════════════════════ */

:root{
  --blue:#009ee3;
  --gray-a:#F0F4F7;
  --gray-b:#E3EAF0;
  --yellow:#ffdc00;
  --hellblau:#bce4fa;
  --icon-bg:#EDEDED;    /* Symbolflächen, neutral statt bläulich */
  --hover-bg:#F5F5F5;   /* Hover auf Zeilen und Karten, passend dazu */
  --scroll-track:#F2F2F2;
  --scroll-thumb:#C2C2C2;   /* neutral und dunkel genug, um sichtbar zu sein */
  --ink:#080808;
  --bg:#ffffff;

  /* Schrift kennt genau zwei Farben. --ink bleibt für Flächen,
     Rahmen und Symbole reserviert. */
  --text:#080808;
  --ink-30:#6E6E6E;   /* zweite Schriftfarbe, 5,4:1 auf Weiß */
  --text-on-dark:#ffffff;
  --text-on-dark-30:rgba(255,255,255,.72);   /* Gegenstück zu --ink-30 */
  --blue-soft:var(--hellblau);   /* eines der 6 DDW-Markenfarben, siehe oben */

  --font:"vista-sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-nav:"vista-slab","Helvetica Neue",Helvetica,Arial,sans-serif;

  /* Typoskala */
  --t-lead:1.125rem;          /* 18px */
  --t-body:15px;
  --t-sm:14px;
  --t-xs:12px;
  --track:.09em;

  --radius:1px;
  --radius-lg:1px;
  --shadow:0 2px 14px rgba(24,24,24,.09);
  --shadow-lg:0 10px 40px rgba(24,24,24,.16);

  --panel-top:92px;   /* unterhalb der schwebenden Leiste */
  --dock-h:72px;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
@supports (height:100dvh){html,body{height:100dvh}}
body{
  font-family:var(--font);font-size:var(--t-body);line-height:1.5;
  color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--radius)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}

.eyebrow{
  font-size:var(--t-xs);letter-spacing:var(--track);text-transform:uppercase;
  font-weight:700;color:var(--ink-30);
}

/* ══════════════════════════════════════════════════════════════════════════
   2. LOGO
   ══════════════════════════════════════════════════════════════════════════ */
/* Logo — Bildmarke allein, sie enthält den Schriftzug schon.
   Feste Originalgröße von draussenwerber.de (135×103), keine Höhen-
   kopplung an die Leiste — das Logo darf unten aus der Leiste herausragen. */
.logo{display:flex;align-items:center;color:var(--text);line-height:0}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.logo-sm{
  width:135px;height:103px;flex:0 0 auto;padding:0;margin-top:8px;
  position:relative;z-index:10;transform-origin:46% 54%;
  transition-duration:.3s;transition-property:transform;
}
.logo-sm svg{width:100%;height:100%;display:block}
@keyframes ddw-wackeln{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(-7deg)}
  32%{transform:rotate(6deg)}
  48%{transform:rotate(-5deg)}
  63%{transform:rotate(4deg)}
  77%{transform:rotate(-2deg)}
  90%{transform:rotate(1deg)}
}
.logo-sm:hover,.logo-sm:focus-visible{animation:ddw-wackeln .7s ease-in-out}
@media (prefers-reduced-motion:reduce){
  .logo-sm:hover,.logo-sm:focus-visible{animation:none}
}

/* ══════════════════════════════════════════════════════════════════════════
   3. ANWENDUNG
   ══════════════════════════════════════════════════════════════════════════ */
#app{position:relative;height:100%}

/* Leiste im Design der echten Website-Navigation: deckend weiß, randlos,
   volle Breite. Kein Glaseffekt mehr — die Karte beginnt direkt darunter. */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:900;
  display:flex;align-items:stretch;gap:2px;
  height:60px;padding:0 24px;background:#fff;
  box-shadow:0 1px 0 rgba(24,24,24,.1),0 4px 10px rgba(24,24,24,.06);
}
.topbar .logo-sm{margin-right:8px;flex:0 0 auto}

/* Elemente rechts in der Leiste — einheitliche Größe und Hover */
.nav-link{
  display:inline-flex;align-items:center;gap:7px;height:100%;
  font-family:var(--font-nav);font-size:15px;font-weight:600;color:var(--text);text-decoration:none;white-space:nowrap;
  padding:0 16px;background:transparent;
  transition:background-color .15s ease;
}
.nav-link:hover{background:var(--yellow)}
.nav-link svg{width:18px;height:18px;flex:0 0 18px;color:var(--text)}

/* Kontakt — dieselbe Bauart wie die übrigen Leisten-Elemente, nur als Link */
.cta-link{
  display:inline-flex;align-items:center;height:100%;
  padding:0 18px;font-family:var(--font-nav);font-size:15px;font-weight:400;
  text-decoration:none;white-space:nowrap;
  background:transparent;color:var(--text);
  transition:background-color .15s ease;
}
.cta-link:hover{background:var(--yellow)}

.menu-item{
  display:block;width:100%;text-align:left;
  padding:9px 12px;font-size:14px;font-weight:400;
  color:var(--text);text-decoration:none;white-space:nowrap;
  border-radius:var(--radius);transition:background .2s ease;
}
.menu-item:hover{background:var(--hover-bg)}
.menu-sep{border:0;border-top:1px solid rgba(0,0,0,.12);margin:6px 4px}

@media (prefers-reduced-motion:reduce){
  .pop.pop--glass{clip-path:none;transition:none}
}

.chip{
/* Wie ein Menüpunkt der echten Website-Navigation: randlos, transparent,
   volle Leistenhöhe. Nur der Hover- und der Offen-Zustand färben sich gelb —
   ein aktiver Filter zeigt sich zusätzlich über einen gelben Unterstrich. */
  display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 18px;
  background:transparent;color:var(--text);
  border:0;box-shadow:none;
  font-family:var(--font-nav);font-size:16px;font-weight:400;white-space:nowrap;
  transition:background-color .15s ease;
}
.chip:hover{background:var(--yellow)}
.chip[aria-expanded="true"]{background:var(--yellow)}
.chip b{font-weight:400}
.chip svg{color:var(--ink-30)}
/* Aktiver Filter: gelber Unterstrich, unabhängig vom Hover-Zustand */
.chip.accent{box-shadow:inset 0 -3px 0 0 var(--yellow)}
.chip.accent[aria-expanded="true"],.chip.accent:hover{box-shadow:none}
.spacer{flex:1}

.icon-btn{padding:8px;border-radius:var(--radius);color:var(--ink-30);display:inline-flex}
.icon-btn:hover{background:var(--hover-bg);color:var(--text)}

/* Popover */
.pop{
  position:absolute;z-index:1200;top:calc(var(--panel-top) - 14px);
  background:var(--bg);border:1px solid var(--gray-b);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);width:320px;padding:18px;
}
.pop h3{margin:0 0 3px;font-size:var(--t-body);font-weight:700}
.pop p.help{margin:0 0 14px;font-size:var(--t-xs);color:var(--ink-30);line-height:1.5}

/* Ausklappmenüs — deckend weiß, kein Milchglas mehr. Der Name
   "pop--glass" ist historisch, das Klasse macht nur noch das Aufklappen. */
.pop.pop--glass{
  display:flex;flex-direction:column;gap:2px;
  width:auto;min-width:240px;padding:10px;
  background:#fff;
  border:1px solid var(--gray-b);border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(0,0,0,.12);
  clip-path:inset(0 0 100% 0);
  transition:clip-path .42s cubic-bezier(.22,.61,.36,1);
}
.pop.pop--glass.open{clip-path:inset(0 0 0 0)}
/* Menüs mit Überschrift brauchen mehr Luft als reine Linklisten */
.pop.pop--glass-pad{padding:16px}
.pop.pop--scroll{max-height:min(70vh,520px);overflow-y:auto}

.stage{position:absolute;inset:0}
#mapRoot{position:absolute;inset:0;background:var(--gray-a)}
.leaflet-container{font-family:var(--font)}
.leaflet-control-attribution{font-size:10px}

/* Linke Karte: Ausgangspunkt */
.panel-left{
  position:absolute;top:var(--panel-top);left:16px;z-index:800;width:296px;
  max-height:calc(100dvh - var(--panel-top) - 64px);
  /* Spalte als Säule: Kopf bleibt stehen, der Rest scrollt.
     overflow:hidden hält die abgerundeten Ecken sauber. */
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);border:1px solid var(--gray-b);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
.panel-left header{flex:0 0 auto;padding:11px 16px 9px;border-bottom:1px solid var(--gray-b)}
.panel-scroll{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
}
/* siehe Abschnitt Scrollbalken weiter unten */
.panel-left h2{margin:0;font-size:var(--t-body);font-weight:700;line-height:1.25}
.panel-hint{margin:2px 0 0;font-size:var(--t-xs);color:var(--ink-30);line-height:1.3}
.origin-list{padding:4px 6px 6px}
/* "Eingrenzung aufheben" — sitzt unten in der Spalte, taucht per JS nur
   auf, sobald tatsächlich ein Gebiet/Umkreis/Linie gesetzt ist. */
.origin-clear{padding:0 16px 16px}
.origin-clear button[hidden]{display:none}
.origin{
  display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;
  border-radius:var(--radius);text-align:left;font-size:var(--t-sm);line-height:1.3;
}
.origin:hover{background:var(--hover-bg)}
.origin[aria-pressed="true"]{background:#fff;color:var(--text)}
.origin[aria-pressed="true"] .origin-ico{background:var(--blue);color:var(--text-on-dark)}
.origin[aria-pressed="true"] em{color:var(--ink-30)}
.origin-ico{
  width:32px;height:32px;flex:0 0 32px;border-radius:var(--radius);
  background:var(--icon-bg);
  display:grid;place-content:center;color:var(--blue);
}
.origin-ico svg{width:17px;height:17px}
.origin span{flex:1;min-width:0}
.origin strong{display:block;font-weight:700;line-height:1.3}
.origin em{font-style:normal;font-size:var(--t-xs);color:var(--ink-30);line-height:1.25;display:block;margin-top:1px}

/* ── Scrollbalken ──────────────────────────────────────────────────────
   Dauerhaft sichtbar statt eingeblendet: Ein Balken, der erst beim Scrollen
   erscheint, nimmt in dem Moment Breite weg — der Inhalt daneben springt.
   Mit fester Spur bleibt die Breite konstant. */
.panel-scroll,
.result-list,
.drawer-body{
  scrollbar-width:thin;                       /* Firefox */
  scrollbar-color:var(--scroll-thumb) var(--scroll-track);
  scrollbar-gutter:stable;                    /* Platz auch ohne Balken */
}
.panel-scroll::-webkit-scrollbar,
.result-list::-webkit-scrollbar,
.drawer-body::-webkit-scrollbar{width:10px}
.panel-scroll::-webkit-scrollbar-track,
.result-list::-webkit-scrollbar-track,
.drawer-body::-webkit-scrollbar-track{background:var(--scroll-track)}
.panel-scroll::-webkit-scrollbar-thumb,
.result-list::-webkit-scrollbar-thumb,
.drawer-body::-webkit-scrollbar-thumb{
  background:var(--scroll-thumb);border-radius:8px;
  border:2px solid var(--scroll-track);       /* wirkt schlanker als er ist */
}
.panel-scroll::-webkit-scrollbar-thumb:hover,
.result-list::-webkit-scrollbar-thumb:hover,
.drawer-body::-webkit-scrollbar-thumb:hover{background:#A8A8A8}

/* Zeilen im Werbeträger-Menü — eigene Klasse, seit die Werkzeuge
   links Kacheln sind. */
.media-row{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 10px;border-radius:var(--radius);cursor:pointer;
  font-size:var(--t-sm);transition:background .14s ease;
}
.media-row:hover{background:var(--hover-bg)}
.media-row input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--ink)}
.media-ico{
  width:32px;height:32px;flex:0 0 32px;border-radius:var(--radius);
  background:var(--icon-bg);display:grid;place-content:center;
}
.media-text{flex:1;min-width:0}
.media-text strong{display:block;font-weight:400}
.media-text em{font-style:normal;font-size:var(--t-xs);color:var(--ink-30)}

.origin-config{padding:0 16px 16px;border-top:1px solid var(--gray-b);padding-top:14px}
.origin-config:empty{display:none}

/* Adressvorschläge im Ausgangspunkt-Panel */
.suggest{
  border:1px solid var(--gray-b);border-radius:var(--radius);background:var(--bg);
  max-height:180px;overflow:auto;margin-bottom:12px;
}
.suggest:empty{display:none}
.suggest button{
  display:block;width:100%;text-align:left;padding:8px 10px;
  font-size:var(--t-sm);border-bottom:1px solid var(--gray-a);
}
.suggest button:last-child{border-bottom:0}
.suggest button:hover{background:var(--hover-bg)}
.field{margin-bottom:12px}
.field label{display:block;font-size:var(--t-xs);color:var(--ink-30);margin-bottom:5px}
.field label output{float:right;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.input,select.input{
  width:100%;padding:9px 11px;border:1px solid var(--gray-b);border-radius:var(--radius);
  font-size:var(--t-sm);background:var(--bg);
}
.input:hover{border-color:var(--ink-30)}
input[type=range]{width:100%;accent-color:var(--blue)}

.btn{
  padding:10px 16px;border-radius:var(--radius);font-size:var(--t-sm);font-weight:700;
  background:var(--ink);color:var(--text-on-dark);border:1px solid var(--ink);
}
.btn:hover{background:#000}
.btn.ghost{background:none;color:var(--text)}

/* Zwei Stile für alle Knöpfe: Gelb für die primäre Aktion eines Dialogs
   oder Werkzeugs, Weiß/umrandet (.ghost) für die sekundäre. Kein Sonderfall
   mehr für "nur Angebots-Aktionen" — einfacher und einheitlicher. */
.btn.cta{background:var(--yellow);border-color:var(--yellow);color:var(--text)}
.btn.cta:hover{background:var(--yellow);opacity:.85}
.btn.ghost:hover{background:var(--hover-bg)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn-row{display:flex;gap:8px}
.status{font-size:var(--t-xs);color:var(--ink-30);margin:8px 0 0;line-height:1.5}
.status.err{color:#c0392b}
.input.err{border-color:#c0392b;background:#fdf3f2}

/* Einwilligungs-Checkbox im Anfrageformular — gleiche Fehlerfarbe wie
   die übrigen Pflichtfelder, nur als Rahmen statt Hintergrund, weil die
   Fläche sonst zu dominant wirkt. */
.consent{
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  margin:16px 0 4px;padding:10px 11px;border:1px solid transparent;border-radius:var(--radius);
  font-size:var(--t-xs);color:var(--ink-30);line-height:1.5;
}
.consent input{width:16px;height:16px;flex:0 0 16px;margin-top:2px;accent-color:var(--ink)}
.consent a{color:var(--text)}
.consent.err{border-color:#c0392b;background:#fdf3f2}

/* Rechte Karte: Ergebnisse */
.panel-right{
  position:absolute;top:var(--panel-top);right:16px;bottom:calc(var(--dock-h) + 16px);z-index:800;width:330px;
  background:var(--bg);border:1px solid var(--gray-b);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
}
.panel-right header{
  display:flex;align-items:center;gap:12px;
  padding:15px 16px 13px;border-bottom:1px solid var(--gray-b);
}
.panel-right header h2{flex:1;min-width:0}
.btn.small{padding:6px 11px;font-size:var(--t-xs);white-space:nowrap}
.panel-right h2{margin:4px 0 0;font-size:var(--t-body);font-weight:700}
.result-list{flex:1;overflow-y:auto;padding:8px}
/* siehe Abschnitt Scrollbalken weiter unten */

.card{
  display:flex;gap:12px;width:100%;text-align:left;padding:11px;
  border:1px solid transparent;border-radius:var(--radius);margin-bottom:2px;
  transition:background .12s,border-color .12s;
}
.card:hover{background:var(--hover-bg)}
.card.is-selected{border-color:var(--text);background:var(--blue-soft)}
.thumb{
  width:56px;height:56px;flex:0 0 56px;border-radius:var(--radius);
  background:var(--icon-bg);
  display:grid;place-content:center;
}
.card-main{flex:1;min-width:0}
.card-main strong{display:block;font-size:var(--t-sm);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:var(--t-xs);color:var(--ink-30);margin-top:2px}
.card-foot{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.price{font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums}
.price em{font-style:normal;font-weight:400;font-size:var(--t-xs);color:var(--ink-30)}
.dist{
  margin-left:auto;font-size:var(--t-xs);color:var(--ink-30);font-variant-numeric:tabular-nums;
}
.empty{padding:40px 24px;text-align:center;color:var(--ink-30);font-size:var(--t-sm);line-height:1.6}
.list-note{
  margin:6px 11px 14px;padding:11px 12px;background:var(--gray-a);
  border-radius:var(--radius);font-size:var(--t-xs);color:var(--ink-30);line-height:1.5;
}

/* Dock — dieselbe weiße Fläche wie Drawer, Popover & Legal-Leiste. Die
   Knöpfe bekommen hier keine Sonderfarben mehr, sondern laufen über das
   normale .btn/.btn.ghost/.btn.cta-Schema wie im Drawer-Footer. */
.dock{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:850;
  display:flex;align-items:center;gap:18px;padding:12px 14px 12px 22px;
  background:#fff;border:1px solid var(--gray-b);
  color:var(--text);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  transition:opacity .2s,transform .2s;
}
.dock.is-idle{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px)}
.dock-count{font-size:var(--t-sm);white-space:nowrap;color:var(--text)}
.dock-count b{font-weight:700}
.dock-count span{color:var(--ink-30)}

/* Auswahl-Schublade */
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:400px;z-index:1100;
  background:var(--bg);border-left:1px solid var(--gray-b);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease;
}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:18px 18px 15px;border-bottom:1px solid var(--gray-b)}
.drawer h2{flex:1;margin:0;font-size:var(--t-body);font-weight:700}
.drawer-body{flex:1;overflow-y:auto;padding:8px 18px}
.drawer-foot{padding:16px 18px;border-top:1px solid var(--gray-b)}
.drawer-actions{display:flex;gap:8px;margin-bottom:8px}
.drawer-actions .btn{flex:1}

/* Linkfeld im Teilen-Dialog */
.share-link{
  display:flex;gap:8px;margin-top:14px;
}
.share-link input{
  flex:1;min-width:0;padding:10px 12px;font-size:var(--t-sm);
  border:1px solid var(--gray-b);border-radius:var(--radius);background:var(--gray-a);
  color:var(--ink-30);
}

.sel-row{padding:14px 0;border-bottom:1px solid var(--gray-a)}
.sel-head{display:flex;gap:10px;align-items:flex-start}
.sel-head strong{flex:1;font-size:var(--t-sm)}
.frame{display:flex;align-items:center;gap:10px;padding:6px 0 6px 0;font-size:var(--t-sm)}
.frame .fdot{width:16px;height:16px;flex:0 0 16px;line-height:0}
.frame .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-30)}
.frame .fprice{font-variant-numeric:tabular-nums;font-weight:700}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:1500;background:rgba(24,24,24,.42);display:grid;place-items:center;padding:24px}
.modal{
  background:var(--bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:min(620px,100%);max-height:86vh;overflow:auto;
}
.modal header{display:flex;align-items:flex-start;gap:16px;padding:24px 26px 18px;border-bottom:1px solid var(--gray-b)}
.modal h2{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.015em}
.modal-body{padding:22px 26px}
.modal-foot{padding:18px 26px 24px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--gray-b)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary{background:var(--gray-a);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px}
.summary-row{display:flex;justify-content:space-between;font-size:var(--t-sm);padding:3px 0}
.summary-row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}

.colmap-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.colmap-row>span{flex:0 0 118px;font-size:var(--t-xs);color:var(--ink-30)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:2500;
  background:var(--ink);color:var(--text-on-dark);padding:11px 18px;border-radius:var(--radius);
  font-size:var(--t-sm);box-shadow:var(--shadow-lg);max-width:82vw;text-align:center;
}

/* Pflichtangaben — schmale Leiste unten links, deckend weiß */
.legal-bar{
  position:absolute;left:16px;bottom:16px;z-index:700;
  display:flex;align-items:center;
  padding:5px 10px;background:#fff;
  border:1px solid var(--gray-b);border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(24,24,24,.1);
}
.legal-bar a{
  padding:2px 9px;font-size:var(--t-xs);color:var(--ink-30);
  text-decoration:none;white-space:nowrap;
}
.legal-bar a:hover{color:var(--text)}
.legal-bar a + a{border-left:1px solid rgba(24,24,24,.14)}

/* Auf dem Telefon liegt die Leiste unter dem Sheet — dort wandern die
   Angaben ans Ende der Inhalte. */
.legal-inline{display:none;padding:16px 16px 20px;border-top:1px solid var(--gray-b)}
.legal-inline a{
  display:inline-block;padding:5px 10px 5px 0;
  font-size:var(--t-xs);color:var(--ink-30);text-decoration:none;
}

/* Werbeträger-Marker auf der Karte */
/* Zwei Bauarten: Dauerwerbung zeigt das DDW-Rasterbild auf weißem Kreis,
   Kampagnenwerbung (ohne eigenes Icon) ein Monogramm auf blauem Kreis. */
.mk{
  display:grid;place-items:center;position:relative;
  width:32px;height:32px;
  background-color:#fff;
  border:0;border-radius:50%;
  box-shadow:0 1px 6px rgba(24,24,24,.3);
  transition:transform .12s ease;
}
.mk.mk-solid{background-color:var(--blue)}
.mk-img{width:20px;height:20px;background-repeat:no-repeat;background-position:center;background-size:contain}
.mk-mono{color:#fff;font-size:9px;font-weight:700;letter-spacing:.02em}
/* Ausgewählt: blauer Haken oben rechts statt Farbwechsel — die Rasterbilder
   selbst tragen bereits ihre eigenen Farben. */
.mk.sel{box-shadow:0 0 0 2px var(--blue),0 1px 6px rgba(0,90,130,.45)}
.mk-badge{
  position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:10px;line-height:15px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.mk-premium{
  position:absolute;top:-4px;left:-4px;width:14px;height:14px;
  background-repeat:no-repeat;background-position:center;background-size:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
}
.mk.hover{transform:scale(1.22)}
.leaflet-marker-icon:focus-visible .mk{outline:2px solid var(--blue);outline-offset:2px}

/* Karten-Popup */
.leaflet-popup-content-wrapper{border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:0}
.leaflet-popup-content{margin:0;width:260px!important}
.pp{padding:15px 16px}
.pp-ico{display:block;margin-bottom:6px}
.pp h4{margin:0;font-size:var(--t-sm);font-weight:700}
.pp .m{font-size:var(--t-xs);color:var(--ink-30);margin:3px 0 10px}
.pp .row{display:flex;justify-content:space-between;font-size:var(--t-sm);padding:3px 0}
.pp .row span:first-child{color:var(--ink-30)}
.pp .row span:last-child{font-weight:700}
/* Farben kommen von .btn.cta — hier nur der Abstand zum Inhalt darüber */
.pp .btn{margin-top:12px}

/* ══════════════════════════════════════════════════════════════════════════
   4. RESPONSIVE
   Drei Layouts aus einem Code:
   ab 1100px  Desktop — beide Boxen neben der Karte
   760–1099   Tablet  — Ausgangspunkt als Überlagerung, Ergebnisse schmaler
   unter 760  Telefon — Ergebnisse als Bottom Sheet mit Ziehgeste
   ══════════════════════════════════════════════════════════════════════════ */
.only-compact{display:none}
.sheet-grip{display:none}

/* Tippflächen auf Touchgeräten vergrößern, ohne die Optik zu ändern */
@media (pointer:coarse){
  .mk{position:relative}
  .mk::after{content:"";position:absolute;inset:-10px}
  .chip{padding:0 16px}
  .origin{padding:13px 10px}
}

/* ── Tablet und schmaler Desktop ─────────────────────────────────── */
@media (max-width:1099px){
  .only-compact{display:inline-flex}
  .topbar{padding:0 14px;gap:0;overflow-x:auto;scrollbar-width:none;height:60px}
  .topbar::-webkit-scrollbar{display:none}
  .nav-link span{display:none}
  .panel-right{width:300px}

  /* Ausgangspunkt liegt jetzt über der Karte statt daneben */
  .panel-left{
    left:16px;width:320px;max-height:calc(100dvh - var(--panel-top) - 24px);
    box-shadow:var(--shadow-lg);
    display:none;
  }
  .panel-left.open{display:flex}
}

/* ── Telefon ──────────────────────────────────────────────────────── */
@media (max-width:759px){
  :root{--panel-top:72px}
  .legal-bar{display:none}
  .legal-inline{display:block}

  .topbar{left:0;right:0;top:0;padding:0 10px;height:52px}
  .chip,.cta-link,.nav-link{padding:0 12px;font-size:14px}
  .chip b{max-width:11ch;overflow:hidden;text-overflow:ellipsis}

  .panel-left{left:8px;right:8px;width:auto;max-height:calc(100dvh - var(--panel-top) - 16px)}

  /* Rechte Box wird zum Bottom Sheet */
  .panel-right{
    --peek:78px;
    top:auto;left:0;right:0;bottom:0;width:auto;
    height:88dvh;max-height:88dvh;
    border:0;border-top:1px solid var(--gray-b);
    border-radius:0;box-shadow:0 -6px 28px rgba(24,24,24,.2);
    transform:translateY(calc(100% - var(--peek)));
    transition:transform .28s cubic-bezier(.22,.61,.36,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .panel-right .sheet-grip,
  .panel-right > header{touch-action:none;cursor:grab}
  .panel-right.half{transform:translateY(46%)}
  .panel-right.full{transform:translateY(0)}
  .panel-right.dragging{transition:none}

  .sheet-grip{
    display:block;width:38px;height:4px;margin:9px auto 3px;
    background:var(--gray-b);border-radius:4px;flex:0 0 auto;
  }
  .panel-right header{padding:8px 16px 12px}

  /* Dock sitzt über dem eingefahrenen Sheet und weicht beim Aufziehen */
  .dock{
    bottom:calc(86px + env(safe-area-inset-bottom));
    left:8px;right:8px;transform:none;
    padding:10px 12px;gap:10px;
  }
  .dock.is-idle{transform:translateY(10px)}
  body.sheet-open .dock{opacity:0;pointer-events:none}
  .dock-count{flex:1;font-size:var(--t-xs)}

  .drawer{width:100%}
  .modal-bg{padding:0}
  .modal{width:100%;max-height:100dvh;border-radius:0}
  .grid-2{grid-template-columns:1fr}
  .pop{width:min(320px,calc(100vw - 24px))}
}

</style>
</head>

function iconFor(medium){
  const n = norm(medium);
  // Zwei Schreibweisen für Ü: norm() macht daraus "u" (Brückenbanner →
  // "bruckenbanner"), aber aus einer Excel kommt öfter schon "ue"

  for(const [re_, id] of MEDIA_ICON_RULES) if(re_.test(n)) return id;
  return 'clpw';
}

   Monogramm-Kachel für Kampagnenwerbung. */
function mediaIconHTML(medium, size){
  const id = iconFor(medium);
  if(RASTER_ICON[id]) return `<img src="${RASTER_ICON[id]}" width="${size}" height="${size}" alt="" style="image-rendering:pixelated">`;
  const mono = MONOGRAM[id] || '?';
  const fs = Math.max(8, Math.round(size*0.3));
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;`
       + `border-radius:50%;background:${CSSVAR('--blue')};color:#fff;font-size:${fs}px;font-weight:700;letter-spacing:.02em">${mono}</span>`;
}

const iconCache = new Map();
function markerIcon(medium, state, premium){
  const key = medium + '|' + state + '|' + (premium?1:0);
  if(!iconCache.has(key)){
    const id = iconFor(medium);
    const raster = RASTER_ICON[id];
    const inner = raster
      ? `<span class="mk-img" style="background-image:url('${raster}')"></span>`
      : `<span class="mk-mono">${MONOGRAM[id]||'?'}</span>`;
    const badge   = state === 'sel' ? '<span class="mk-badge" aria-hidden="true">✓</span>' : '';
    const stern   = premium ? `<span class="mk-premium" style="background-image:url('${STERN_ICON}')" aria-hidden="true"></span>` : '';
    iconCache.set(key, L.divIcon({
      className:'',
      html:`<span class="mk ${state} ${raster?'':'mk-solid'}">${inner}${badge}${stern}</span>`,
      iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-16]
    }));
  }
  return iconCache.get(key);
}

/* Ein- und Mehrzahl, damit nirgends „1 Flächen" steht */
const plural = (n, ein, viele) => `${n} ${n === 1 ? ein : viele}`;

let toastTimer;
function toast(msg, ms=3200){
  let t = $('.toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), ms);
}

function num(v){
  if(typeof v === 'number') return v;
  const s = String(v ?? '').replace(/[^\d,.\-]/g,'');
  if(!s) return null;
  const n = parseFloat(s.includes(',') && s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''));
  return Number.isFinite(n) ? n : null;
}

   maxNativeZoom:16, weil Esri für diesen Stil ab Stufe 17 keine echten
   Kacheln mehr ausliefert. maxZoom:19 lässt Leaflet die vorhandenen Kacheln
   beim tieferen Hineinzoomen hochskalieren, statt eine leere Karte zu zeigen.
   In der finalen Version wird dieser Block ohnehin durch Google Maps ersetzt. */
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';

  attribution:'Kartengrundlage: Esri, HERE, Garmin, &copy; OpenStreetMap-Mitwirkende'};

/* ══════════════════════════════════════════════════════════════════════════
   GEOMETRIE
   ══════════════════════════════════════════════════════════════════════════ */
const R = 6371000;
function segDist(p, a, b){
  const toXY = ll => [ll[1]*Math.PI/180*Math.cos(p[0]*Math.PI/180)*R, ll[0]*Math.PI/180*R];
  const [px,py]=toXY(p),[ax,ay]=toXY(a),[bx,by]=toXY(b);
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  let t = l2 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function distToPath(p, path){
  let min = Infinity;
  for(let i=0;i<path.length-1;i++) min = Math.min(min, segDist(p, path[i], path[i+1]));
  return min;
}
function distToPoints(p, pts){
  let min = Infinity;
  pts.forEach(q => min = Math.min(min, map.distance(p, q)));
  return min;
}
function inPolygon(p, ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const yi=ring[i][0],xi=ring[i][1],yj=ring[j][0],xj=ring[j][1];
    if(((yi>p[0])!==(yj>p[0])) && (p[1] < (xj-xi)*(p[0]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

/* ══════════════════════════════════════════════════════════════════════════
   DATEN
   ══════════════════════════════════════════════════════════════════════════ */
function readFile(file, then){
  const r = new FileReader();
  r.onload = e => {
    try{
      const wb = XLSX.read(e.target.result,{type:'array'});
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      then(raw, file.name);
    }catch(err){ toast('Die Datei konnte nicht gelesen werden.'); console.error(err); }
  };
  r.readAsArrayBuffer(file);
}

function detectColumns(headers){
  const m={};
  headers.forEach(h=>{ const n=norm(h);
    for(const [f,al] of Object.entries(COLUMN_ALIASES)){ if(m[f])continue; if(al.includes(n)){m[f]=h;break;} }
  });
  headers.forEach(h=>{ const n=norm(h);
    if(Object.values(m).includes(h)) return;
    for(const [f,hints] of Object.entries(COLUMN_HINTS)){ if(m[f])continue; if(hints.some(p=>n.includes(p))){m[f]=h;break;} }
  });
  return m;
}

function ingest(raw, filename){
  if(!raw.length){ toast('Das Tabellenblatt ist leer.'); return false; }
  LAST.raw = raw; LAST.filename = filename;
  LAST.headers = [...new Set(raw.flatMap(r=>Object.keys(r)))];
  LAST.mapping = detectColumns(LAST.headers);
  return applyMapping();
}

function applyMapping(){
  const m = LAST.mapping;
  const missing = REQUIRED_FIELDS.filter(f=>!m[f]);
  if(missing.length){
    toast(`${missing.map(f=>FIELD_LABELS[f]).join(' und ')} fehlt. Bitte Spalten zuordnen.`);
    openDataModal();
    return false;
  }
  const rows=[]; let skipped=0;
  LAST.raw.forEach((r,i)=>{
    const lat=num(r[m.lat]), lng=num(r[m.lng]);
    if(lat===null||lng===null||Math.abs(lat)>90||Math.abs(lng)>180){skipped++;return;}
    const get=f=>m[f]?String(r[m[f]]??'').trim():'';
    const medium = get('medium')||'Werbefläche';
    rows.push({
      frameId:get('frameId')||('Z'+(i+2)), sid:get('sid')||get('frameId')||String(i),
      bezirk:get('bezirk'), plz:get('plz'), adresse:get('adresse'),
      kategorie:get('kategorie') || (CAMPAIGN_TYPES.includes(medium) ? 'Kampagnenwerbung' : 'Dauerwerbung'),
      medium, typ:get('typ'), netz:get('netz'),
      premium:/^(1|ja|true|x|wahr)$/i.test(get('premium')),
      wirkrichtung:get('wirkrichtung'), preis:num(r[m.preis]), hub:get('hub'), lat, lng
    });
  });
  if(!rows.length){ toast('Keine gültigen Koordinaten gefunden.'); return false; }

  S.rows = rows;
  const bySid = new Map();
  rows.forEach(r=>{
    if(!bySid.has(r.sid)) bySid.set(r.sid,{...r, frames:[]});
    bySid.get(r.sid).frames.push(r);
  });
  S.sites = [...bySid.values()];

  S.media = [...new Set(rows.filter(r=>r.kategorie==='Dauerwerbung').map(r=>r.medium))].sort((a,b)=>a.localeCompare(b,'de'));
  S.activeMedia = new Set(S.media);
  S.activeCampaign = new Set(CAMPAIGN_TYPES);
  S.activeNetz = new Set(ALLE_NETZE);
  S.premiumOnly = false;
  S.selection.clear();

  updateMediaChip(); updateCampaignChip();
  refresh();
  if(skipped) toast(`${rows.length} Flächen geladen, ${skipped} Zeilen ohne Koordinaten übersprungen.`);
  return true;
}

function karlMarxAlleePunkte(n){
  const a=[52.5199,13.4230], b=[52.5218,13.4459], pts=[];
  for(let i=0;i<n;i++){ const t=i/(n-1||1);
    pts.push([a[0]+(b[0]-a[0])*t+(Math.random()-.5)*.0006, a[1]+(b[1]-a[1])*t+(Math.random()-.5)*.0006]);
  }
  return pts;

/* Sicherheitsabfrage vor jedem Schritt, der eine getroffene Auswahl
   verwirft. Ohne Auswahl entfällt sie — dann gibt es nichts zu verlieren.
   Eine Stelle für alle vier Lösch-Wege im Werkzeug (Logo, Zurücksetzen-Chip,
   Papierkorb in der Schublade), damit sie sich nicht mehr uneinheitlich
   verhalten. „Eingrenzung aufheben" braucht das bewusst nicht — dort geht
   ja gerade nichts aus dem Warenkorb verloren. */
function bestaetigen({titel, text, dann}){
  if(!S.selection.size){ dann(); return; }
  modal(`
    <header><div><h2>${esc(titel)}</h2></div></header>
    <div class="modal-body">
      <p style="margin:0;font-size:var(--t-body)">${text}</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>Abbrechen</button>
      <button class="btn cta" data-ok>OK</button>
    </div>`,
  bg=>{
    bg.querySelector('[data-close]').onclick = ()=> bg.close();
    bg.querySelector('[data-ok]').onclick = ()=>{ bg.close(); dann(); };
    bg.querySelector('[data-ok]').focus();
  });
}

          <div class="btn-row" style="margin-top:12px">
            <button class="btn ghost wide" id="oDrawReset">Neu zeichnen</button>

/* Zeichenmodus an- und ausschalten. Der Doppelklick-Zoom der Karte muss
   dabei pausieren, sonst zoomt der abschließende Doppelklick hinein. */
function startDraw(){
  drawPts = [];
  layerOrigin.clearLayers();
  map.doubleClickZoom.disable();
  map.on('click', onDrawClick);
  map.on('dblclick', finishDraw);
}
/* Zeichnen beenden und den Doppelklick-Zoom wieder freigeben. */
function stopDraw(){
  map.off('click', onDrawClick);
  map.off('dblclick', finishDraw);
  map.doubleClickZoom.enable();
}

let drawPts = [];
function onDrawClick(e){
  drawPts.push([e.latlng.lat, e.latlng.lng]);
  layerOrigin.clearLayers();
  // Die Vorschau ist reine Darstellung — interactive:false, sonst fängt
  // sie beim nächsten Klick den Klick selbst statt der Karte ab.
  if(drawPts.length>1)
    L.polyline(drawPts,{interactive:false, color:CSSVAR('--ink'), weight:2, dashArray:'5 4'}).addTo(layerOrigin);
  drawPts.forEach(p=>L.circleMarker(p,
    {interactive:false, radius:4, color:'#fff', weight:2, fillColor:CSSVAR('--yellow'), fillOpacity:1})
    .addTo(layerOrigin));
}
function finishDraw(){
  if(drawPts.length<3) return;
  // Zeichnen beenden, sonst würde der nächste Klick auf die Karte einen
  // weiteren Eckpunkt setzen und die fertige Fläche verwerfen.
  stopDraw();
  setOrigin({type:'draw', label:'Eigenes Gebiet', polygon:drawPts.slice()});
  refresh();
}

let activeOrigin = null;
$('#originList').addEventListener('click', e=>{
  const b = e.target.closest('[data-origin]'); if(!b) return;
  const type = b.dataset.origin;
  if(ORIGIN_UI[activeOrigin]?.stop) ORIGIN_UI[activeOrigin].stop();

  if(activeOrigin === type){
    activeOrigin = null; $('#originConfig').innerHTML='';
    setOrigin(null); refresh();
  }else{
    // Beim Wechsel des Werkzeugs die bisherige Eingrenzung fallen lassen —
    // sonst bliebe ein Gebiet stehen, das zum neuen Werkzeug nicht gehört.
    activeOrigin = type;
    setOrigin(null);
    $('#originConfig').innerHTML = ORIGIN_UI[type].html;
    ORIGIN_UI[type].init();
    refresh();
  }
  $$('.origin').forEach(o=>o.setAttribute('aria-pressed', String(o.dataset.origin===activeOrigin)));
});

/* Zeichnet den Ausgangspunkt auf der Karte und schaltet den Umkreis-Chip
   sowie den „Eingrenzung aufheben"-Knopf passend dazu sichtbar. o===null
   räumt beides wieder ab — das ist der zentrale Ort dafür, kein Aufruf
   irgendwo sonst löscht layerOrigin oder den Knopf direkt. */
function setOrigin(o){
  S.origin = o;
  layerOrigin.clearLayers();
  $('#chipRadius').hidden = !o || o.type==='draw';
  $('#originClear').hidden = !o;
  if(!o) return;

  // Alle Formen des Ausgangspunkts sind reine Darstellung. Ohne
  // interactive:false würden Fläche und Umkreis die Klicks auf die
  // darunterliegenden Standorte abfangen.
  const deko = {interactive:false};
  const yellow = CSSVAR('--yellow'), ink = CSSVAR('--ink');
  if(o.path){
    L.polyline(o.path,{...deko, color:ink, weight:7, opacity:.18}).addTo(layerOrigin);
    L.polyline(o.path,{...deko, color:ink, weight:2.5}).addTo(layerOrigin);
  }
  if(o.polygon){
    L.polygon(o.polygon,{...deko, color:ink, weight:2, fillColor:yellow, fillOpacity:.1}).addTo(layerOrigin);
  }
  (o.points||[]).forEach(p=>{
    L.circleMarker(p,{...deko, radius:9, color:ink, weight:2, fillColor:yellow, fillOpacity:1}).addTo(layerOrigin);
  });
  if(o.points && o.points.length===1 && S.radius){
    L.circle(o.points[0],{...deko, radius:S.radius, color:ink, weight:1, dashArray:'4 4', fillOpacity:.04}).addTo(layerOrigin);
  }
}

/* Overpass-Abfrage über mehrere Server, POST mit Ausweich auf GET.
   Der Content-Type ist entscheidend: ohne ihn schickt der Browser text/plain,
   und Overpass liest den Rumpf dann wörtlich als Abfrage statt das data-Feld
   auszupacken. Mehrere Server als Ausweichziel, weil der Hauptserver
   regelmäßig drosselt. */
const OVERPASS = ['https://overpass-api.de/api/interpreter',
                  'https://overpass.kumi.systems/api/interpreter',
                  'https://overpass.osm.ch/api/interpreter'];

async function overpass(query, sekunden=20){
  let letzterFehler;
  for(const url of OVERPASS){
    for(const methode of ['POST','GET']){
      const abbruch = new AbortController();
      const uhr = setTimeout(()=>abbruch.abort(), sekunden*1000);
      try{
        const opt = methode === 'POST'
          ? {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
             body:'data=' + encodeURIComponent(query), signal:abbruch.signal}
          : {signal:abbruch.signal};
        const ziel = methode === 'GET' ? url + '?data=' + encodeURIComponent(query) : url;
        const res = await fetch(ziel, opt);
        if(!res.ok) throw new Error(res.status === 429 ? 'ausgelastet' : 'Status ' + res.status);
        const daten = await res.json();
        // Overpass meldet Zeitüberläufe mit Status 200 und leerer Liste,
        // der Grund steht dann in remark. Ohne diese Prüfung sieht ein
        // abgebrochener Lauf wie ein leeres Suchergebnis aus.
        if(daten.remark) throw new Error(daten.remark);
        console.debug('Overpass', methode, daten.elements?.length ?? 0, 'Treffer');
        return daten;
      }catch(err){
        letzterFehler = err;
        console.warn('Overpass', methode, url, err.name || err.message);
      }finally{
        clearTimeout(uhr);
      }
    }
  }
  throw letzterFehler;
}

function fehlertext(err){
  const m = String(err?.message || '');
  if(m.includes('timed out') || m.includes('Query timed out'))
    return 'Der Kartendienst hat abgebrochen. Bitte in einer kleineren Stadt oder gleich noch einmal versuchen.';
  if(m.includes('out of memory'))
    return 'Das Suchgebiet ist zu groß für den Kartendienst.';
  if(err?.name === 'AbortError')
    return 'Der Kartendienst antwortet nicht. Das liegt meist an Auslastung — oder eine Firewall im Firmennetz blockiert ihn.';
  if(String(err?.message).includes('ausgelastet'))
    return 'Der Kartendienst ist gerade ausgelastet. Bitte kurz warten.';
  return 'Die Abfrage ist fehlgeschlagen. Besteht eine Internetverbindung?';
}

function cityBBox(){
  const list = S.sites;
  if(!list.length) return null;
  const lats=list.map(s=>s.lat), lngs=list.map(s=>s.lng);
  return [Math.min(...lats)-.02,Math.min(...lngs)-.03,Math.max(...lats)+.02,Math.max(...lngs)+.03].join(',');
}

/* ── Filialsuche ──────────────────────────────────────────────────────── */
async function searchBrand(){
  const q = $('#oBrand').value.trim(); if(!q) return;
  const bbox = cityBBox(); if(!bbox){ toast('Keine Standortdaten geladen.'); return; }
  const st = $('#oBrandStatus');
  st.textContent = 'Wird gesucht …'; st.classList.remove('err');
  // Beschriftung sichern, damit der Knopf nach der Suche wieder seinen
  // ursprünglichen Text zeigt statt dauerhaft "Suche läuft …".
  const knopf = $('#oBrandGo'), knopfText = knopf.textContent;
  knopf.disabled = true; knopf.textContent = 'Suche läuft …';

  // Stufe 1 ist schnell, weil brand und shop selten gesetzte Schlüssel sind
  // und Overpass darüber zuerst filtert. Stufe 2 durchsucht alle benannten
  // Objekte und läuft nur, wenn Stufe 1 nichts findet.
  const t = q.replace(/["\\]/g,'');
  const stufen = [
    `[out:json][timeout:20];
     ( nwr["brand"~"${t}",i](${bbox});
       nwr["operator"~"${t}",i](${bbox});
       nwr["shop"]["name"~"${t}",i](${bbox}); );
     out center 300;`,
    `[out:json][timeout:25];
     nwr["name"~"${t}",i](${bbox});
     out center 300;`
  ];
  const punkte = daten => (daten.elements || [])
    .map(el=>[el.lat ?? el.center?.lat, el.lon ?? el.center?.lon])
    .filter(p=>p[0]!=null && p[1]!=null);

  try{
    let pts = punkte(await overpass(stufen[0]));
    if(!pts.length){
      st.textContent = 'Erweitere die Suche …';
      pts = punkte(await overpass(stufen[1], 30));
    }
    if(!pts.length){ st.textContent = `Keine Filialen für „${q}" in ${S.city} gefunden.`; return; }
    setOrigin({type:'branches', label:`${q} · ${pts.length} Filialen`, points:pts});
    map.fitBounds(L.latLngBounds(pts).pad(.1));
    st.textContent = `${pts.length} Filialen gefunden.`;
    refresh();
  }catch(err){
    st.textContent = fehlertext(err); st.classList.add('err'); console.error(err);
  }finally{
    knopf.disabled = false; knopf.textContent = knopfText;
  }
}

/* ── ÖPNV-Linien ──────────────────────────────────────────────────────── */
/* In OpenStreetMap ist dieselbe Linienart unterschiedlich getaggt —
   S-Bahnen laufen je nach Stadt als light_rail oder als train. */
const ROUTE_TYPES = {
  subway:['subway'], light_rail:['light_rail','train','subway'],
  tram:['tram'], bus:['bus','trolleybus']
};

/* Wegstücke aneinanderhängen: Overpass liefert die Teilstücke in
   Relationsreihenfolge, aber teils gegenläufig. Ohne Sortierung springt
   die Linie hin und her. */
function stitch(ways){
  if(!ways.length) return [];
  const rest = ways.slice();
  let linie = rest.shift().slice();
  let treffer = true;
  while(rest.length && treffer){
    treffer = false;
    for(let i=0;i<rest.length;i++){
      const w = rest[i], nah = (a,b)=>Math.abs(a[0]-b[0])<1e-6 && Math.abs(a[1]-b[1])<1e-6;
      const ende = linie[linie.length-1], anfang = linie[0];
      if(nah(ende, w[0]))                 linie = linie.concat(w.slice(1));
      else if(nah(ende, w[w.length-1]))   linie = linie.concat(w.slice().reverse().slice(1));
      else if(nah(anfang, w[w.length-1])) linie = w.slice(0,-1).concat(linie);
      else if(nah(anfang, w[0]))          linie = w.slice().reverse().slice(0,-1).concat(linie);
      else continue;
      rest.splice(i,1); treffer = true; break;
    }
  }
  return linie;
}

async function searchLine(){
  const ref = $('#oLine').value.trim(); if(!ref) return;
  const arten = ROUTE_TYPES[$('#oLineType').value] || ['subway'];
  const bbox = cityBBox(); if(!bbox){ toast('Keine Standortdaten geladen.'); return; }
  const st = $('#oLineStatus');
  st.textContent = 'Wird geladen …'; st.classList.remove('err');
  const knopf = $('#oLineGo'), knopfText = knopf.textContent;
  knopf.disabled = true; knopf.textContent = 'Wird geladen …';

  const r = ref.replace(/["\\]/g,'');
  const query = `[out:json][timeout:20];
    relation["type"="route"]["route"~"^(${arten.join('|')})$"]["ref"~"^${r}$",i](${bbox});
    out geom;`;
  try{
    const data = await overpass(query, 25);
    // längste Relation gewinnt — Hin- und Rückrichtung sind getrennt erfasst
    let beste = [];
    data.elements.forEach(rel=>{
      const ways = (rel.members||[])
        .filter(m=>m.type==='way' && m.geometry)
        .map(m=>m.geometry.map(g=>[g.lat,g.lon]));
      const linie = stitch(ways);
      if(linie.length > beste.length) beste = linie;
    });
    if(beste.length < 2){
      st.textContent = `Für „${ref}" wurde in ${S.city} kein Verlauf gefunden.`;
      return;
    }
    setOrigin({type:'line', label:`Linie ${ref}`, path:beste});
    map.fitBounds(L.latLngBounds(beste).pad(.08));
    st.textContent = `Verlauf geladen, ${beste.length} Stützpunkte.`;
    refresh();
  }catch(err){
    st.textContent = fehlertext(err); st.classList.add('err'); console.error(err);
  }finally{
    knopf.disabled = false; knopf.textContent = knopfText;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   RELEVANZ + DARSTELLUNG
   ══════════════════════════════════════════════════════════════════════════ */
function relevance(site){
  const o = S.origin;
  const p = [site.lat, site.lng];
  if(!o) return {rel:true, dist:null};
  if(o.polygon) return {rel:inPolygon(p,o.polygon), dist:null};
  let d = Infinity;
  if(o.path)   d = Math.min(d, distToPath(p, o.path));
  if(o.points) d = Math.min(d, distToPoints(p, o.points));
  return {rel:d<=S.radius, dist:d};
}

function refresh(){
  layerSites.clearLayers();
  S.markers.clear();

  const pool = S.sites.filter(s=>{
    if(S.showCampaign){
      if(s.kategorie !== 'Kampagnenwerbung') return false;
      if(!S.activeCampaign.has(s.medium)) return false;
      if(NETZE[s.medium] && !S.activeNetz.has(s.netz)) return false;
      return true;
    }
    if(s.kategorie !== 'Dauerwerbung') return false;
    if(!S.activeMedia.has(s.medium)) return false;
    if(S.premiumOnly && !s.premium) return false;
    return true;
  });

  const scored = pool.map(s=>({site:s, ...relevance(s)}));
  // Mit Ausgangspunkt nach Entfernung, sonst alphabetisch nach Bezirk und
  // Adresse — eine Liste in Dateireihenfolge ist für niemanden lesbar.
  const relevant = scored.filter(x=>x.rel).sort(S.origin
    ? (a,b)=>(a.dist??0)-(b.dist??0)
    : (a,b)=>(a.site.bezirk||'').localeCompare(b.site.bezirk||'','de')
          || (a.site.adresse||'').localeCompare(b.site.adresse||'','de',{numeric:true}));
  S.results = relevant;

  // Icons sind DOM-Elemente, Punkte liegen auf einer Zeichenfläche. Ab einer
  // gewissen Menge kippt das Verhältnis, dann zeigen nur noch die
  // ausgewählten Standorte ein Icon.
  const ICON_GRENZE = 400;
  const vieleTreffer = relevant.length > ICON_GRENZE;

  scored.forEach(({site, rel})=>{
    const sel = S.selection.has(site.sid);
    // Relevante Standorte tragen das Werbeträger-Icon, das Umfeld bleibt ein
    // schlichter Punkt — das hält die Karte lesbar und die Zeichenlast niedrig.
    const m = ((rel && !vieleTreffer) || sel)
      ? L.marker([site.lat,site.lng], {icon:markerIcon(site.medium, sel?'sel':'', site.premium), keyboard:false})
      : L.circleMarker([site.lat,site.lng], rel
          ? {radius:5,   color:'#fff', weight:1, fillColor:CSSVAR('--blue'), fillOpacity:1}
          : {radius:3.5, color:'#fff', weight:1, fillColor:'#c8d2da',        fillOpacity:.55});
    // autoPanPadding sorgt dafür, dass Leaflet die Karte weiter verschiebt,
    // wenn das Popup sonst hinter der Navigationsleiste (oben, ~68px hoch)
    // oder zu dicht am Rand aufgehen würde.
    m.bindPopup(()=>popup(site),{closeButton:true,offset:[0,-4],
      autoPanPaddingTopLeft:[24,84], autoPanPaddingBottomRight:[24,24]});
    if(m.setStyle) m.options.grundRadius = m.options.radius;   // für den Hover
    m.on('popupopen', ()=>{ const b=document.querySelector('.pp .btn'); if(b) b.onclick=()=>{toggle(site);map.closePopup();}; });
    m.addTo(layerSites);
    S.markers.set(site.sid, m);
  });

  renderResults();
  renderDock();
  renderDrawer();
}

function popup(site){
  const sel = S.selection.has(site.sid);
  const rows = [
    ['Werbeträger', site.medium], ['Typ', site.typ], ['Netz', site.netz],
    ['Wirkrichtung', site.wirkrichtung],
    ['Flächen', site.frames.length],
    ['Preis pro Tag', site.preis!=null?euro(site.preis):null]
  ].filter(([,v])=>v!=null && v!=='');
  return `<div class="pp">
    <span class="pp-ico">${mediaIconHTML(site.medium,24)}${site.premium?`<img src="${STERN_ICON}" width="14" height="14" alt="Premium" style="margin-left:4px;vertical-align:top">`:''}</span>
    <h4>${esc(site.adresse||'Werbefläche')}</h4>
    <p class="m">${[site.plz,site.bezirk].filter(Boolean).map(esc).join(' · ')}</p>
    ${rows.map(([k,v])=>`<div class="row"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}
    <button class="btn cta wide">${sel?'Entfernen':'Zur Auswahl'}</button>
  </div>`;
}

/* Sammelauswahl für alles, was gerade in der Liste steht */
function renderAddAll(){
  const b = $('#addAll'), n = S.results.length;
  b.hidden = n < 2;
  if(b.hidden) return;
  const alleDrin = S.results.every(({site})=>S.selection.has(site.sid));
  b.textContent = alleDrin ? 'Auswahl aufheben' : `Alle ${n} hinzufügen`;
  b.dataset.mode = alleDrin ? 'off' : 'on';
}

$('#addAll').addEventListener('click', e=>{
  const aus = e.currentTarget.dataset.mode === 'off';
  S.results.forEach(({site})=>{
    if(aus) S.selection.delete(site.sid);
    else if(!S.selection.has(site.sid))
      S.selection.set(site.sid, {site, frames:new Set(site.frames.map(f=>f.frameId))});
  });
  refresh();
  toast(aus ? 'Auswahl aufgehoben.' : `${plural(S.results.length,'Standort','Standorte')} hinzugefügt.`);
});

function renderResults(){
  const list = $('#resultList');
  const n = S.results.length;
  renderAddAll();
  const anzahl = plural(n, 'Fläche', 'Flächen');
  $('#resultTitle').textContent = S.origin
    ? `${anzahl} in der Nähe`
    : `${anzahl} in Berlin`;

  if(!n){
    const gefiltert = S.showCampaign
      ? (S.activeCampaign.size < CAMPAIGN_TYPES.length || S.activeNetz.size < ALLE_NETZE.length)
      : (S.activeMedia.size < S.media.length || S.premiumOnly);
    list.innerHTML = `<div class="empty">
      ${gefiltert
        ? `Kein Treffer — der Filter zeigt gerade nur einen Teil der ${S.showCampaign?'Kampagnenwerbung':'Dauerwerbung'}.`
        : S.origin
          ? 'In diesem Umkreis liegen keine Werbeflächen.'
          : 'Keine Werbeflächen für diese Auswahl.'}
      ${gefiltert ? '<br><button class="btn ghost small" data-clearfilter style="margin-top:14px">Filter zurücksetzen</button>' : ''}
      ${!gefiltert && S.origin && S.origin.type !== 'draw' && S.radius < 3000
        ? `<br><button class="btn ghost small" data-widen style="margin-top:14px">Umkreis auf ${
             (Math.min(S.radius*2,3000)/1000).toFixed(1).replace('.',',')} km vergrößern</button>` : ''}
    </div>`;
    return;
  }

  const GRENZE = 200;

  list.innerHTML = S.results.slice(0,GRENZE).map(({site,dist})=>{
    const sel = S.selection.has(site.sid);
    return `<button class="card ${sel?'is-selected':''}" data-sid="${esc(site.sid)}">
      <span class="thumb">
        ${mediaIconHTML(site.medium,30)}
      </span>
      <span class="card-main">
        <strong>${esc(site.adresse||'Werbefläche')}${site.premium?` <img src="${STERN_ICON}" width="12" height="12" alt="Premium">`:''}</strong>
        <span class="card-meta">${esc(site.medium)}${site.netz?` · ${esc(site.netz)}`:''}${site.frames.length>1?` · ${site.frames.length} Flächen`:''}${site.wirkrichtung?` · Blick ${esc(site.wirkrichtung)}`:''}</span>
        <span class="card-foot">
          ${site.preis!=null?`<span class="price">${euro(site.preis)} <em>pro Tag und Fläche</em></span>`:'<span class="price"><em>Preis auf Anfrage</em></span>'}
          ${dist!=null?`<span class="dist">${dist<1000?Math.round(dist)+' m':(dist/1000).toFixed(1)+' km'}</span>`:''}
        </span>
      </span>
    </button>`;
  }).join('');

  // Bei sehr vielen Treffern wird die Liste gekürzt — das gehört gesagt.
  if(n > GRENZE) list.insertAdjacentHTML('beforeend',
    `<p class="list-note">Es werden ${GRENZE} von ${n} Flächen angezeigt.
     Grenzen Sie die Suche ein, um alle zu sehen.</p>`);
}

$('#resultList').addEventListener('click', e=>{
  if(e.target.closest('[data-clearfilter]')){
    if(S.showCampaign){
      S.activeCampaign = new Set(CAMPAIGN_TYPES);
      S.activeNetz = new Set(ALLE_NETZE);
      updateCampaignChip();
    }else{
      S.activeMedia = new Set(S.media);
      S.premiumOnly = false;
      updateMediaChip();
    }
    refresh();
    return;
  }
  if(e.target.closest('[data-widen]')){
    // Kreis verdoppeln statt nur die Zahl zu ändern — direkter Weg aus dem
    // Leerzustand heraus, ohne dass man selbst auf den Umkreis-Chip muss.
    S.radius = Math.min(S.radius * 2, 3000);
    $('#chipRadiusLabel').textContent = 'Umkreis ' +
      (S.radius >= 1000 ? (S.radius/1000).toFixed(1)+' km' : S.radius+' m');
    setOrigin(S.origin);   // Kreis neu zeichnen
    refresh();
    return;
  }
  const c = e.target.closest('[data-sid]'); if(!c) return;
  const site = S.sites.find(s=>s.sid===c.dataset.sid);
  if(!site) return;
  toggle(site);

let openPop = null;
function popover(anchor, html, init){
  closePop();
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = html;
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.max(12, Math.min(r.left, innerWidth - el.offsetWidth - 16)) + 'px';
  anchor.setAttribute('aria-expanded','true');
  openPop = {el, anchor};
  init?.(el);
  setTimeout(()=>document.addEventListener('mousedown', outside), 0);
}
function outside(e){ if(openPop && !openPop.el.contains(e.target) && !openPop.anchor.contains(e.target)) closePop(); }
function closePop(){
  if(!openPop) return;
  openPop.anchor.setAttribute('aria-expanded','false');
  openPop.el.remove(); openPop = null;
  document.removeEventListener('mousedown', outside);
}

/* Dialog. Schließen läuft immer über bg.close(), damit der Escape-Handler
   mit abgeräumt wird — sonst bleibt pro geöffnetem Dialog einer am
   Dokument hängen. */
function modal(html, init){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;

  /* Fokus im Dialog halten: Ohne diese Schleife wandert man mit der
     Tabulatortaste hinter das Fenster in die Karte dahinter — für die
     Bedienung ohne Maus ist das der Unterschied zwischen benutzbar und
     nicht. offsetParent!==null filtert versteckte Elemente heraus, die
     zwar im DOM stehen, aber gerade nicht sichtbar sind. */
  const beiTaste = e => {
    if(e.key === 'Escape'){ bg.close(); return; }
    if(e.key !== 'Tab') return;
    const ziele = [...bg.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select, textarea')]
      .filter(el=>el.offsetParent !== null);
    if(!ziele.length) return;
    const erster = ziele[0], letzter = ziele[ziele.length-1];
    if(e.shiftKey && document.activeElement === erster){ e.preventDefault(); letzter.focus(); }
    else if(!e.shiftKey && document.activeElement === letzter){ e.preventDefault(); erster.focus(); }
  };
  bg.close = () => { document.removeEventListener('keydown', beiTaste); bg.remove(); };

  document.body.appendChild(bg);
  bg.addEventListener('mousedown', e=>{ if(e.target === bg) bg.close(); });
  document.addEventListener('keydown', beiTaste);
  init?.(bg);
  return bg;
}

/* Bundesländer für "Standort Firmensitz" im Anfrageformular — amtliche
   Reihenfolge, International als letzte Option. */
const BUNDESLAENDER = ['Baden-Württemberg','Bayern','Berlin','Brandenburg','Bremen','Hamburg',
  'Hessen','Mecklenburg-Vorpommern','Niedersachsen','Nordrhein-Westfalen','Rheinland-Pfalz',
  'Saarland','Sachsen','Sachsen-Anhalt','Schleswig-Holstein','Thüringen','International'];
const DATENSCHUTZ_URL = 'https://www.draussenwerber.de/Unternehmen/Datenschutz.html';

function openRequest(){
  /* Prototyp-Grenze: Alle Felder werden erfasst und validiert, aber
     nirgends abgeschickt oder gespeichert — es gibt noch keine echte
     Anfrage-Übertragung (Salesforce o.ä.). Nur Anrede, Name und E-Mail
     fließen aktuell in die Bestätigung ein.
     Für den Livegang: hier den tatsächlichen Versand ergänzen und alle
     Felder mitschicken, inklusive der Einwilligung. */
  const flaechen = frameCount();
  const uebersicht = `
    <div class="summary">
      <div class="summary-row"><span>Ausgewählte Standorte</span><span>${S.selection.size}</span></div>
      <div class="summary-row"><span>Werbeflächen</span><span>${flaechen}</span></div>
      ${S.origin?`<div class="summary-row"><span>Ausgangspunkt</span><span>${esc(S.origin.label)}</span></div>`:''}
    </div>`;

  const bg = modal(`
    <header><div><h2>Angebot anfragen</h2></div></header>
    <div class="modal-body" id="requestBody">
      ${uebersicht}
      <div class="grid-2">
        <div class="field"><label for="rqAnrede">Anrede *</label>
          <select class="input" id="rqAnrede" autocomplete="honorific-prefix">
            <option value="">Bitte wählen</option>
            <option>Frau</option><option>Herr</option><option>Divers</option>
          </select></div>
        <div class="field"><label for="rqVor">Vorname *</label><input class="input" id="rqVor" autocomplete="given-name"></div>
        <div class="field"><label for="rqName">Nachname *</label><input class="input" id="rqName" autocomplete="family-name"></div>
        <div class="field"><label for="rqFirma">Unternehmen *</label><input class="input" id="rqFirma" autocomplete="organization"></div>
      </div>
      <div class="field"><label for="rqMail">Geschäftliche E-Mail-Adresse *</label><input class="input" id="rqMail" type="email" autocomplete="email"></div>
      <div class="grid-2">
        <div class="field"><label for="rqTel">Telefonnummer</label><input class="input" id="rqTel" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="rqBundesland">Standort Firmensitz *</label>
          <select class="input" id="rqBundesland" autocomplete="address-level1">
            <option value="">Bitte wählen</option>
            ${BUNDESLAENDER.map(b=>`<option>${b}</option>`).join('')}
          </select></div>
      </div>
      <div class="field"><label for="rqZeit">Wunschzeitraum</label><input class="input" id="rqZeit" placeholder="z. B. ab Oktober, zwei Wochen"></div>
      <div class="field"><label for="rqText">Ihr Anliegen *</label><textarea class="input" id="rqText" rows="3" placeholder="Worum geht es bei Ihrer Kampagne?"></textarea></div>
      <label class="consent" id="rqConsentRow">
        <input type="checkbox" id="rqConsent">
        <span>Ich habe die <a href="${DATENSCHUTZ_URL}" target="_blank" rel="noopener">Datenschutzbestimmungen</a> zur Kenntnis
          genommen und möchte von der DRAUSSENWERBER GmbH unter den oben angegebenen Kontaktdaten kontaktiert werden. *</span>
      </label>
      <p class="status" id="rqHinweis">Mit * gekennzeichnete Abfragen bitte ausfüllen. Ihre oben angegebene
        E-Mail-Adresse werden wir auch für die Übersendung weiterer Informationen zu unseren Veranstaltungen,
        Unternehmen, Studien und Newsletter verwenden. Hieran besteht unsererseits ein berechtigtes Interesse
        (Art. 6 Abs. 1 lit. f DS-GVO). Sie können dieser Verwendung jederzeit ohne Angaben von Gründen widersprechen.
        Weitere Informationen enthalten unsere <a href="${DATENSCHUTZ_URL}" target="_blank" rel="noopener">Datenschutzhinweise</a>.</p>
    </div>
    <div class="modal-foot" id="requestFoot">
      <button class="btn ghost" data-close>Abbrechen</button>
      <button class="btn cta" id="send">Anfrage senden</button>
    </div>`,
  bg=>{
    bg.querySelector('[data-close]').onclick = ()=> bg.close();
    bg.querySelector('#rqAnrede').focus();

    // Textfelder, Auswahlfelder und Textarea laufen über dieselbe
    // "nicht leer"-Prüfung; die E-Mail bekommt zusätzlich die Formatprüfung.
    const pflichtfelder = () => [
      {el:bg.querySelector('#rqAnrede')},
      {el:bg.querySelector('#rqVor')},
      {el:bg.querySelector('#rqName')},
      {el:bg.querySelector('#rqFirma')},
      // bewusst nachsichtig geprüft: ein @ mit Punkt dahinter reicht als Plausibilität
      {el:bg.querySelector('#rqMail'), email:true},
      {el:bg.querySelector('#rqBundesland')},
      {el:bg.querySelector('#rqText')}
    ];

    bg.querySelector('#send').onclick = ()=>{
      const felder = pflichtfelder();
      const consent = bg.querySelector('#rqConsent');
      const leer   = felder.filter(f=>!f.el.value.trim());
      const email  = felder.find(f=>f.email);
      const emailUngueltig = !leer.includes(email) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.el.value.trim());

      bg.querySelectorAll('.input').forEach(i=>i.classList.remove('err'));
      bg.querySelector('#rqConsentRow').classList.remove('err');
      const hinweis = bg.querySelector('#rqHinweis');
      hinweis.classList.remove('err');

      if(leer.length || emailUngueltig || !consent.checked){
        leer.forEach(f=>f.el.classList.add('err'));
        if(emailUngueltig) email.el.classList.add('err');
        if(!consent.checked) bg.querySelector('#rqConsentRow').classList.add('err');

        hinweis.textContent = emailUngueltig && !leer.length
          ? 'Bitte eine gültige geschäftliche E-Mail-Adresse angeben.'
          : leer.length
            ? 'Bitte alle mit * markierten Felder ausfüllen.'
            : 'Bitte den Datenschutzbestimmungen zustimmen.';
        hinweis.classList.add('err');
        (leer[0]?.el || (emailUngueltig ? email.el : consent)).focus();
        return;
      }

      // Bestätigung statt kurzer Meldung — es ist der einzige Moment,
      // in dem der Nutzer etwas abgibt.
      const mail = email.el;
      bg.querySelector('h2').textContent = 'Ihre Anfrage ist unterwegs';
      bg.querySelector('#requestBody').innerHTML = `
        ${uebersicht}
        <p style="margin:18px 0 0;font-size:var(--t-body);line-height:1.55">
          Vielen Dank. Wir haben Ihre Auswahl erhalten und melden uns
          innerhalb von zwei Werktagen mit einem konkreten Angebot bei
          <b>${esc(mail.value.trim())}</b>.
        </p>
        <p class="status">Ihre Auswahl bleibt erhalten — Sie können sie weiter bearbeiten,
        exportieren oder als Link teilen.</p>`;
      bg.querySelector('#requestFoot').innerHTML =
        '<button class="btn cta" data-fertig>Schließen</button>';
      bg.querySelector('[data-fertig]').onclick = ()=> bg.close();
      bg.querySelector('[data-fertig]').focus();
    };
  });
  return bg;
}

$('#listInput').addEventListener('change', e=>{
  if(!e.target.files[0]) return;
  readFile(e.target.files[0], (raw,name)=>{
    const m = detectColumns([...new Set(raw.flatMap(r=>Object.keys(r)))]);
    if(!m.lat || !m.lng){ toast('In der Liste wurden keine Koordinaten gefunden.'); return; }
    const pts = raw.map(r=>[num(r[m.lat]),num(r[m.lng])]).filter(p=>p[0]!=null&&p[1]!=null);

    map.fitBounds(L.latLngBounds(pts).pad(.1));
    refresh();
  });
  e.target.value='';
});

    try{
      let path;
      if(/\.gpx$/i.test(file.name)){
        const doc = new DOMParser().parseFromString(ev.target.result,'application/xml');
        path = [...doc.querySelectorAll('trkpt, rtept')].map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]);
      }else{
        const gj = JSON.parse(ev.target.result);
        const f0 = gj.type==='FeatureCollection' ? gj.features[0] : gj;
        const g = f0.geometry || f0;
        path = (g.type==='MultiLineString' ? g.coordinates.flat() : g.coordinates).map(c=>[c[1],c[0]]);
      }
      if(!path || path.length<2) throw new Error('leer');
      setOrigin({type:'event', label:file.name.replace(/\.[^.]+$/,''), path});
      map.fitBounds(L.latLngBounds(path).pad(.1));
      refresh();
    }catch(err){ toast('Die Streckendatei konnte nicht gelesen werden.'); console.error(err); }
  };
  r.readAsText(file);
  e.target.value='';
});

/* ══════════════════════════════════════════════════════════════════════════
   KOMPAKTBEDIENUNG — Bottom Sheet und Ausgangspunkt-Überlagerung
   ══════════════════════════════════════════════════════════════════════════ */
const istTelefon = () => matchMedia('(max-width:759px)').matches;
const istKompakt = () => matchMedia('(max-width:1099px)').matches;

/* Ausgangspunkt als Überlagerung öffnen und schließen */
$('#chipOrigin').addEventListener('click', ()=>{
  $('.panel-left').classList.toggle('open');
});
$('#closeOrigin').addEventListener('click', ()=> $('.panel-left').classList.remove('open'));

/* Sichtbares Sheet ermitteln */
function sheet(){ return $('#panelResults'); }

function setSheet(zustand){
  const el = sheet();
  el.classList.remove('half','full');
  if(zustand !== 'peek') el.classList.add(zustand);
  document.body.classList.toggle('sheet-open', zustand !== 'peek');
  setTimeout(()=>map.invalidateSize(), 300);
}

/* Ziehgeste: der Griff und die Kopfzeile ziehen, die Liste scrollt weiter */
let zug = null;
let letzterZugWeg = 0;   // damit ein Ziehen nicht zusätzlich als Tippen zählt
function zugStart(e){
  if(!istTelefon()) return;
  const el = e.currentTarget.closest('.panel-right');
  zug = {el, griff:e.currentTarget, y0:e.clientY, start:el.getBoundingClientRect().top, moved:0};
  el.classList.add('dragging');
  e.currentTarget.setPointerCapture?.(e.pointerId);
}
function zugMove(e){
  if(!zug) return;
  zug.moved = e.clientY - zug.y0;
  const y = Math.max(0, zug.start + zug.moved);
  zug.el.style.transform = `translateY(${y - (innerHeight - zug.el.offsetHeight)}px)`;
}
function zugEnd(){
  if(!zug) return;
  const el = zug.el;
  el.classList.remove('dragging');
  el.style.transform = '';
  const oben = el.getBoundingClientRect().top;
  const h = innerHeight;
  // auf den nächstgelegenen Rastpunkt einschnappen
  const punkte = [['peek', h - 78], ['half', h * .54], ['full', h - el.offsetHeight]];
  const naechster = punkte.reduce((a,b)=> Math.abs(b[1]-oben) < Math.abs(a[1]-oben) ? b : a);
  setSheet(naechster[0]);
  letzterZugWeg = Math.abs(zug.moved);
  zug = null;
}

['#panelResults'].forEach(sel=>{
  const el = $(sel);
  // Gezogen wird nur am Griff und an der Kopfzeile — der Inhalt bleibt scrollbar
  [el.querySelector('.sheet-grip'), el.querySelector('header')].filter(Boolean).forEach(griff=>{
    griff.addEventListener('pointerdown', zugStart);
    griff.addEventListener('pointermove', zugMove);
    griff.addEventListener('pointerup', zugEnd);
    griff.addEventListener('pointercancel', zugEnd);
  });
  el.querySelector('.sheet-grip').addEventListener('click', ()=>{
    // Nach einem Ziehen kommt zusätzlich ein Klick — der darf nicht
    // die gerade eingerastete Stufe wieder verstellen.
    if(!istTelefon() || letzterZugWeg > 6){ letzterZugWeg = 0; return; }
    setSheet(el.classList.contains('full') ? 'peek' : el.classList.contains('half') ? 'full' : 'half');
  });
});

/* Layoutwechsel sauber auffangen */
let letzteBreite = innerWidth;
addEventListener('resize', ()=>{
  if(Math.abs(innerWidth - letzteBreite) < 40) return;
  letzteBreite = innerWidth;
  $('#chipOrigin').hidden = !istKompakt();
  if(!istKompakt()) $('.panel-left').classList.remove('open');
  if(!istTelefon()){
    $$('.panel-right').forEach(el=>el.classList.remove('half','full','dragging'));
    document.body.classList.remove('sheet-open');
  }
  map.invalidateSize();
});

/* ══════════════════════════════════════════════════════════════════════════
   TEILEN UND EXPORT
   Der Link trägt den Zustand in der Adresse: ausgewählte Standorte,
   Werbeträger- und Kampagnenfilter. Er greift nur auf derselben Datenbasis —
   bei einer anderen Excel finden sich die Standort-IDs schlicht nicht wieder.
   ══════════════════════════════════════════════════════════════════════════ */
function shareURL(){
  const p = new URLSearchParams();
  if(S.selection.size) p.set('sids', [...S.selection.keys()].join(','));
  if(S.activeMedia.size && S.activeMedia.size !== S.media.length)
    p.set('medien', [...S.activeMedia].join('~'));
  if(S.showCampaign) p.set('kw', '1');
  return location.href.split('#')[0] + '#' + p.toString();
}

function restoreFromHash(){
  const roh = location.hash.replace(/^#/, '');
  if(!roh) return;
  const p = new URLSearchParams(roh);

  const medien = p.get('medien');
  if(medien){
    const gewuenscht = medien.split('~').filter(m=>S.media.includes(m));
    if(gewuenscht.length) S.activeMedia = new Set(gewuenscht);
    updateMediaChip();
  }
  if(p.get('kw') === '1'){ S.showCampaign = true; updateCampaignChip(); }

  const sids = (p.get('sids')||'').split(',').filter(Boolean);
  let gefunden = 0;
  sids.forEach(sid=>{
    const site = S.sites.find(s=>s.sid===sid);
    if(!site) return;
    S.selection.set(site.sid, {site, frames:new Set(site.frames.map(f=>f.frameId))});
    gefunden++;
  });
  if(gefunden) refresh();
  if(sids.length && gefunden < sids.length)
    toast(`${gefunden} von ${sids.length} Standorten konnten geladen werden.`);
}

$('#btnShare').addEventListener('click', ()=>{
  const url = shareURL();
  modal(`
    <header><div><h2>Teilen</h2></div></header>
    <div class="modal-body">
      <p style="margin:0;font-size:var(--t-body)">Kopieren Sie diesen Link, um ihn mit anderen zu teilen. Er öffnet den Standortfinder mit Ihrer aktuellen Auswahl.</p>
      <div class="share-link">
        <input id="shareInput" readonly value="${esc(url)}">
        <button class="btn cta" id="shareCopy">Kopieren</button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-close>Schließen</button></div>`,
  bg=>{
    const feld = bg.querySelector('#shareInput');
    feld.addEventListener('focus', ()=>feld.select());
    bg.querySelector('[data-close]').onclick = ()=> bg.close();
    bg.querySelector('#shareCopy').onclick = async ()=>{
      feld.select();
      try{ await navigator.clipboard.writeText(url); }
      catch{ document.execCommand('copy'); }
      bg.querySelector('#shareCopy').textContent = 'Kopiert';
      location.hash = url.split('#')[1] || '';
    };
  });
});

/* Export der Auswahl als CSV — Semikolon und BOM, damit deutsches Excel
   die Datei ohne Importdialog richtig öffnet. */
function exportCSV(){
  const spalten = ['Frame ID','SID','Bezirk','Postleitzahl','Adresse','Kategorie','Medium','Typ',
                   'Netz','Premium','Wirkrichtung','Preis pro Tag','HUB','Längengrad','Breitengrad'];
  const zeilen = [spalten.join(';')];
  S.selection.forEach(({site, frames})=>site.frames
    .filter(f=>frames.has(f.frameId))
    .forEach(f=>zeilen.push([f.frameId,f.sid,f.bezirk,f.plz,f.adresse,f.kategorie,f.medium,f.typ,
      f.netz,f.premium?'ja':'',f.wirkrichtung, f.preis!=null?String(f.preis).replace('.',','):'', f.hub,f.lng,f.lat]
      .map(v=>`"${String(v ?? '').replace(/"/g,'""')}"`).join(';'))));

  const blob = new Blob(['\uFEFF' + zeilen.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `standortauswahl-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

$('#btnExport').addEventListener('click', ()=>{
  const flaechen = frameCount();
  modal(`
    <header><div><h2>Export</h2></div></header>
    <div class="modal-body">
      <p style="margin:0;font-size:var(--t-body)">Tabelle mit den ausgewählten Standorten laden.</p>
      <div class="summary" style="margin-top:16px">
        <div class="summary-row"><span>Standorte</span><span>${S.selection.size}</span></div>
        <div class="summary-row"><span>Werbeflächen</span><span>${flaechen}</span></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>Abbrechen</button>
      <button class="btn cta" id="csvGo">Tabelle laden</button>
    </div>`,
  bg=>{
    bg.querySelector('[data-close]').onclick = ()=> bg.close();
    bg.querySelector('#csvGo').onclick = ()=>{ exportCSV(); bg.close(); toast('Tabelle wurde geladen.'); };
  });
});
